<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Teligencia — Lab Portal</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Teligencia Lab Portal — ISO/IEC 17025 cybersecurity testing operations.">
  <meta name="theme-color" content="#0A2540">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script>
    /* Theme boot — runs before styles paint to avoid FOUC. */
    (function () {
      try {
        var pref = localStorage.getItem('teligencia.theme');
        var t = pref === 'light' || pref === 'dark'
          ? pref
          : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
